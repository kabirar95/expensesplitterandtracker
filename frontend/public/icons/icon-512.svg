<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#cyberBg)" stroke="url(#neonGlow)" stroke-width="8" />

  <!-- Hexagon border shield -->
  <polygon points="256,76 408,160 408,352 256,436 104,352 104,160" fill="none" stroke="#8b5cf6" stroke-width="4" opacity="0.4" />

  <!-- Glowing Divvy Logo (D with split nodes and Rupee/Dollar slash) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="120" fill="none" stroke="url(#neonGlow)" stroke-width="12" stroke-dasharray="32 10" />
    <!-- Dynamic Split Bolt / D glyph -->
    <path d="M208 170 L288 170 C330 170 352 202 352 256 C352 310 330 342 288 342 L208 342 Z" fill="none" stroke="#00f2ff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="180" y1="256" x2="310" y2="256" stroke="#ec4899" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
