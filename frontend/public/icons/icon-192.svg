<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="192" height="192" rx="42" fill="url(#cyberBg)" stroke="url(#neonGlow)" stroke-width="4" />

  <!-- Hexagon border shield -->
  <polygon points="96,28 152,60 152,132 96,164 40,132 40,60" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.4" />

  <!-- Glowing Divvy Logo (D with split nodes and Rupee/Dollar slash) -->
  <g filter="url(#glow)">
    <circle cx="96" cy="96" r="46" fill="none" stroke="url(#neonGlow)" stroke-width="5" stroke-dasharray="12 4" />
    <!-- Dynamic Split Bolt / D glyph -->
    <path d="M78 64 L108 64 C124 64 132 76 132 96 C132 116 124 128 108 128 L78 128 Z" fill="none" stroke="#00f2ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="68" y1="96" x2="116" y2="96" stroke="#ec4899" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
