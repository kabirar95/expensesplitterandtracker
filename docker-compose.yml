# ============================================================
# DOCKER COMPOSE — Orchestrates Frontend + Backend
# ============================================================
# Services:
#   1. Frontend (React + Vite) → port 5173
#   2. Backend (FastAPI + Uvicorn) → port 8000
#   3. Database (Supabase PostgreSQL Cloud)
#
# Run everything with:
#   docker compose up --build
# ============================================================

services:
  # ── Frontend (React + Vite) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - app-network

  # ── Backend (FastAPI + Uvicorn) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
